server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# AI provider: Google Gemini free tier (no card, no paid provider)
# Gemini is reached through its OpenAI-compatible surface, so the standard
# Spring AI OpenAI client is used with different paths (note: no /v1).
# ---------------------------------------------------------------------------
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.api-key=${AI_API_KEY:unset}
spring.ai.openai.chat.completions-path=/chat/completions
spring.ai.openai.chat.options.model=gemini-3.6-flash

# Low temperature: security analysis should be literal, not creative
spring.ai.openai.chat.options.temperature=0.2

# Fail fast on free-tier rate limits instead of retrying for minutes
spring.ai.retry.max-attempts=2

spring.application.name=ai-log-analyzer

# Upload limit: 10MB. Logs are text; anything bigger is not a log file.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Render terminates TLS at its proxy; trust the forwarded scheme so any
# absolute URL the app builds is correct.
server.forward-headers-strategy=framework

# Health / info, used by Render and uptime pingers
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=AI Log Analyzer
info.app.version=1.0.0
