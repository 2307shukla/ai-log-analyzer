server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# AI provider: Google Gemini free tier (no card, no paid provider)
# Gemini is reached through its OpenAI-compatible surface, so the standard
# Spring AI OpenAI client is used with different paths (note: no /v1).
# ---------------------------------------------------------------------------
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.api-key=${AI_API_KEY:unset}
spring.ai.openai.chat.completions-path=/chat/completions
spring.ai.openai.chat.options.model=gemini-3.6-flash

# Low temperature: security analysis should be literal, not creative
spring.ai.openai.chat.options.temperature=0.2

# Fail fast on free-tier rate limits instead of retrying for minutes
spring.ai.retry.max-attempts=2

spring.application.name=ai-log-analyzer

# Upload limit: 5MB, sized for Render's 512 MB free tier. Longer logs are sampled (first 100,000 lines).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Render terminates TLS at its proxy; trust the forwarded scheme so any
# absolute URL the app builds is correct.
server.forward-headers-strategy=framework

# Health / info, used by Render and uptime pingers
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=AI Log Analyzer
info.app.version=1.0.0

# --- Production operations ----------------------------------------------
# Finish in-flight requests on deploy instead of cutting them off.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.compression.enabled=true

# Uploads are kept in memory per visitor session; expire them, and keep the cookie private.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# --- Analysis --------------------------------------------------------------
# Offline GeoIP database (DB-IP City Lite, CC BY 4.0). The Docker image downloads it at build time;
# when the file is missing GeoIP is skipped and everything else works unchanged.
geoip.database=${GEOIP_DATABASE:}
# Alert rules: a YAML or JSON file; empty means the bundled alert-rules.yml.
alerts.rules-file=${ALERT_RULES_FILE:}
