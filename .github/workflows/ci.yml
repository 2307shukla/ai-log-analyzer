name: CI

on:
  push:
    branches: [main]
  # Every pull request, including stacked ones that target another feature branch.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Make wrapper executable
        run: chmod +x mvnw

      - name: Build and run tests
        run: ./mvnw -B --no-transfer-progress verify

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ai-log-analyzer:ci .

      - name: Verify image starts
        run: |
          docker run -d --name smoke -e AI_API_KEY=unset -p 8080:8080 ai-log-analyzer:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "Application responded"
              exit 0
            fi
            sleep 2
          done
          echo "Application did not start in time"
          docker logs smoke
          exit 1
